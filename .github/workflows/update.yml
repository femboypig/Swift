name: Swift update

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: swift-subscription-update
  cancel-in-progress: false

env:
  PYTHONPATH: src
  SING_BOX_VERSION: "1.13.19"
  SING_BOX_SHA256: "ef88a9e577d474210867bd708933d042e9b70106529df2656182c9db90106aa1"
  SWIFT_SING_BOX: .cache/sing-box/sing-box

jobs:
  update:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 58

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check .

      - name: Restore sing-box cache
        id: core-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .cache/sing-box
          key: sing-box-${{ runner.os }}-${{ runner.arch }}-${{ env.SING_BOX_VERSION }}

      - name: Install sing-box
        shell: bash
        run: |
          set -euo pipefail
          if [[ -x "$SWIFT_SING_BOX" ]] && "$SWIFT_SING_BOX" version | grep -q "sing-box version $SING_BOX_VERSION"; then
            exit 0
          fi

          mkdir -p .cache/sing-box "$RUNNER_TEMP/swift-core"
          swift_archive="sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          swift_release="https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}"
          curl --fail --location --retry 3 --silent --show-error \
            --output "$RUNNER_TEMP/swift-core/$swift_archive" \
            "$swift_release/$swift_archive"
          echo "$SING_BOX_SHA256  $RUNNER_TEMP/swift-core/$swift_archive" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/swift-core/$swift_archive" \
            -C "$RUNNER_TEMP/swift-core" \
            "sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box"
          install -m 0755 \
            "$RUNNER_TEMP/swift-core/sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box" \
            "$SWIFT_SING_BOX"
          "$SWIFT_SING_BOX" version

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Collect and test configs
        id: pipeline
        shell: bash
        run: |
          set +e
          python -m swiftproxy.main
          swift_exit=$?
          set -e
          echo "exit_code=$swift_exit" >> "$GITHUB_OUTPUT"
          if [[ "$swift_exit" -ne 0 && "$swift_exit" -ne 2 ]]; then
            exit "$swift_exit"
          fi

      - name: Collect and test Telegram proxies
        id: telegram
        shell: bash
        run: |
          set +e
          python -m swiftproxy.telegram_main
          swift_exit=$?
          set -e
          echo "exit_code=$swift_exit" >> "$GITHUB_OUTPUT"
          if [[ "$swift_exit" -ne 0 && "$swift_exit" -ne 2 ]]; then
            exit "$swift_exit"
          fi

      - name: Check generated subscriptions
        if: steps.pipeline.outputs.exit_code == '0'
        run: python -m swiftproxy.main --check-output

      - name: Check generated Telegram proxies
        if: steps.telegram.outputs.exit_code == '0'
        run: python -m swiftproxy.telegram_main --check-output

      - name: Commit changed data
        shell: bash
        run: |
          set -euo pipefail
          git add sub data stats.json Telegram
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "femboyPig"
          git config user.email "harimassaa@gmail.com"
          git commit -m "Update Swift subscriptions"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Prepare Pages files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/swift-pages/Telegram"
          cp -a sub/. "$RUNNER_TEMP/swift-pages/"
          cp -a Telegram/. "$RUNNER_TEMP/swift-pages/Telegram/"

      - name: Upload subscriptions
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/swift-pages

      - name: Deploy subscriptions
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Update Telegram status message
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_ID: ${{ secrets.TELEGRAM_MESSAGE_ID }}
        run: python -m swiftproxy.telegram_publish

      - name: Report held publish
        if: always() && steps.pipeline.outputs.exit_code == '2'
        run: |
          echo "Swift kept the previous subscriptions because this run looked unhealthy." >&2
          exit 1

      - name: Report held Telegram publish
        if: always() && steps.telegram.outputs.exit_code == '2'
        run: |
          echo "Swift kept the previous Telegram proxies because this run looked unhealthy." >&2
          exit 1
