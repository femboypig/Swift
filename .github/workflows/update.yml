name: Swift update

on:
  schedule:
    # The exhaustive verifier shares a home connection and Karing's direct
    # dialer. Back-to-back hourly runs have exhausted that dialer in practice.
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      generation_run_id:
        description: "Reuse the exact collected generation from this run"
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: swift-subscription-update
  cancel-in-progress: false

env:
  PYTHONPATH: src
  SING_BOX_VERSION: "1.13.19"
  SING_BOX_SHA256: "ef88a9e577d474210867bd708933d042e9b70106529df2656182c9db90106aa1"
  SWIFT_SING_BOX: .cache/sing-box/sing-box

jobs:
  collect:
    name: Collect canonical candidates
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.generation_run_id == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --disable-pip-version-check .
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Build exact RU generation
        run: python -m swiftproxy.generation
      - name: Upload generation
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: swift-ru-generation
          path: data/ru-generation
          retention-days: 2

  ru-verify:
    name: Exhaustive RU verification
    needs: collect
    if: ${{ always() && (needs.collect.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.generation_run_id != '')) }}
    runs-on: [self-hosted, Linux]
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    outputs:
      publishable: ${{ steps.ru_result.outputs.publishable }}
    env:
      SWIFT_BIND_INTERFACE: wlan0
      SWIFT_DIRECT_SOCKS: 127.0.0.1:3065
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download exact generation
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: swift-ru-generation
          run-id: ${{ inputs.generation_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: data/ru-generation
      - name: Install Python package
        run: python3 -m pip install --break-system-packages --disable-pip-version-check . || python3 -m pip install --disable-pip-version-check .
      - name: Install pinned sing-box
        shell: bash
        run: |
          set -euo pipefail
          if [[ -x "$SWIFT_SING_BOX" ]] && "$SWIFT_SING_BOX" version | grep -q "sing-box version $SING_BOX_VERSION"; then
            exit 0
          fi
          mkdir -p .cache/sing-box "$RUNNER_TEMP/swift-core"
          archive="sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          release="https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}"
          curl --fail --location --retry 3 --silent --show-error --output "$RUNNER_TEMP/swift-core/$archive" "$release/$archive"
          echo "$SING_BOX_SHA256  $RUNNER_TEMP/swift-core/$archive" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/swift-core/$archive" -C "$RUNNER_TEMP/swift-core" "sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box"
          install -m 0755 "$RUNNER_TEMP/swift-core/sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box" "$SWIFT_SING_BOX"
      - name: Run golden RU verifier
        id: ru_result
        shell: bash
        run: |
          set +e
          python3 -m swiftproxy.ru_golden
          code=$?
          set -e
          if [[ "$code" -eq 0 ]]; then
            echo "publishable=true" >> "$GITHUB_OUTPUT"
          elif [[ "$code" -eq 2 ]]; then
            echo "publishable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RU path is unhealthy; keeping the last known-good publication"
          else
            exit "$code"
          fi
      - name: Test Telegram proxies from RU
        if: ${{ steps.ru_result.outputs.publishable == 'true' }}
        shell: bash
        run: |
          set +e
          python3 -m swiftproxy.telegram_main
          code=$?
          set -e
          if [[ "$code" -ne 0 && "$code" -ne 2 ]]; then exit "$code"; fi
      - name: Upload completed RU artifact and telemetry
        id: upload_ru
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: swift-ru-publication
          path: |
            data/ru-generation
            data/ru-publication
            data/telegram-history.json
            Telegram
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
      - name: Wait before artifact upload retry
        if: ${{ always() && steps.upload_ru.outcome == 'failure' }}
        run: sleep 30
      - name: Retry completed RU artifact and telemetry upload
        if: ${{ always() && steps.upload_ru.outcome == 'failure' }}
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: swift-ru-publication
          path: |
            data/ru-generation
            data/ru-publication
            data/telegram-history.json
            Telegram
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 7

  publish:
    name: Validate and publish generation
    needs: ru-verify
    # Recovery dispatches skip collect. Test the verifier result explicitly;
    # success() also sees the skipped transitive collect dependency.
    if: ${{ always() && needs.ru-verify.result == 'success' && needs.ru-verify.outputs.publishable == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check .
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: swift-ru-publication
      - name: Verify generation and stage publication
        run: python -m swiftproxy.publication
      - name: Validate generated outputs
        run: |
          python -m swiftproxy.main --check-output
          python -m swiftproxy.telegram_main --check-output
      - name: Commit one complete generation
        shell: bash
        run: |
          set -euo pipefail
          git add sub data/ru-history.json data/telegram-history.json stats.json Telegram
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "femboyPig"
          git config user.email "harimassaa@gmail.com"
          git commit -m "Update Swift subscriptions"
          git push
      - name: Prepare Pages artifact
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/swift-pages/Telegram"
          cp -a sub/. "$RUNNER_TEMP/swift-pages/"
          cp -a Telegram/. "$RUNNER_TEMP/swift-pages/Telegram/"
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: swift-pages-files
          path: ${{ runner.temp }}/swift-pages
          retention-days: 1
      - name: Update Telegram status message
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_ID: ${{ secrets.TELEGRAM_MESSAGE_ID }}
        run: python -m swiftproxy.telegram_publish

  pages:
    name: Deploy subscriptions
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: swift-pages-files
          path: ${{ runner.temp }}/swift-pages
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/swift-pages
      - name: Deploy subscriptions
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
