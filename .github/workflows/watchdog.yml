name: Swift schedule watchdog

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start a missed update
        shell: bash
        run: |
          set -euo pipefail
          runs=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/update.yml/runs?per_page=10")

          active_run=$(jq -r '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")][0].id // empty' <<<"$runs")
          if [[ -n "$active_run" ]]; then
            active_created=$(jq -r --arg id "$active_run" '.workflow_runs[] | select((.id|tostring) == $id).created_at' <<<"$runs")
            active_age=$(( $(date -u +%s) - $(date -u -d "$active_created" +%s) ))
            if (( active_age > 9000 )); then
              echo "Active Swift update $active_run running for ${active_age}s (> 2.5h); cancelling stale run."
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${active_run}/cancel" || true
            else
              echo "A Swift update ($active_run) is already active (${active_age}s ago); nothing to do."
              exit 0
            fi
          fi

          latest=$(jq -r '.workflow_runs[0].created_at // ""' <<<"$runs")

          if [[ -n "$latest" ]]; then
            age=$(( $(date -u +%s) - $(date -u -d "$latest" +%s) ))
            if (( age < 18000 )); then
              echo "Swift update started ${age}s ago; nothing to do."
              exit 0
            fi
          fi

          echo "No active Swift update and none started in the last five hours; dispatching one."
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/update.yml/dispatches" \
            -f ref=main
