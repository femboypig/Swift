name: Swift schedule watchdog

on:
  schedule:
    - cron: "2,32 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start a missed update
        shell: bash
        run: |
          set -euo pipefail
          latest=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/update.yml/runs?per_page=1" \
            --jq '.workflow_runs[0].created_at // ""')

          if [[ -n "$latest" ]]; then
            age=$(( $(date -u +%s) - $(date -u -d "$latest" +%s) ))
            if (( age < 1500 )); then
              echo "Swift update started ${age}s ago; nothing to do."
              exit 0
            fi
          fi

          echo "No Swift update started in the last 25 minutes; dispatching one."
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/update.yml/dispatches" \
            -f ref=main
