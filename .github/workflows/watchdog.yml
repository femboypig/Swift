name: Swift schedule watchdog

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start a missed update
        shell: bash
        run: |
          set -euo pipefail
          runs=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/update.yml/runs?per_page=10")

          active=$(jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")] | length' <<<"$runs")
          if (( active > 0 )); then
            echo "A Swift update is already active; nothing to do."
            exit 0
          fi

          latest=$(jq -r '.workflow_runs[0].created_at // ""' <<<"$runs")

          if [[ -n "$latest" ]]; then
            age=$(( $(date -u +%s) - $(date -u -d "$latest" +%s) ))
            if (( age < 18000 )); then
              echo "Swift update started ${age}s ago; nothing to do."
              exit 0
            fi
          fi

          echo "No active Swift update and none started in the last five hours; dispatching one."
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/update.yml/dispatches" \
            -f ref=main
