[project]
name = "Swift"
tagline = "Filter the garbage. Keep what works."
repository = "https://github.com/femboypig/swift"

[paths]
history = "data/history.json"
order = "data/order.json"
stats = "stats.json"

[collection]
fetch_timeout = 25

[white_evidence]
fetch_timeout = 90

[[white_evidence.cidr_sources]]
id = "hxehex-white-cidr"
name = "hxehex"
url = "https://raw.githubusercontent.com/hxehex/russia-mobile-internet-whitelist/main/cidrwhitelist.txt"

[[white_evidence.cidr_sources]]
id = "artembsk-white-cidr"
name = "artembsk"
url = "https://raw.githubusercontent.com/artembsk/russia-mobile-internet-whitelist/main/cidrwhitelist.txt"

[[white_evidence.domain_sources]]
id = "hxehex-white-domains"
name = "hxehex"
url = "https://raw.githubusercontent.com/hxehex/russia-mobile-internet-whitelist/main/whitelist.txt"

[[white_evidence.domain_sources]]
id = "artembsk-white-domains"
name = "artembsk"
url = "https://raw.githubusercontent.com/artembsk/russia-mobile-internet-whitelist/main/whitelist.txt"

[limits]
main = 200
white = 200

[selection]
main_candidates = 400
white_candidates = 250

[testing]
concurrency = 20
probes = 5
rounds = 2
connect_timeout = 5
request_timeout = 10
download_bytes = 262144
download_timeout = 15
download_url = "https://speed.cloudflare.com/__down?bytes={bytes}"
geo_url = "https://www.cloudflare.com/cdn-cgi/trace"
throughput_probe_ratio = 0.8
main_min_throughput_bps = 131072
white_min_throughput_bps = 49152
per_config_timeout = 160
global_timeout = 3000
probe_urls = [
  "https://www.gstatic.com/generate_204",
  "https://cp.cloudflare.com/generate_204",
  "https://connectivitycheck.platform.hicloud.com/generate_204",
]
white_probe_urls = [
  "https://captive.apple.com/hotspot-detect.html",
  "https://www.msftconnecttest.com/connecttest.txt",
  "https://www.gstatic.com/generate_204",
  "https://cp.cloudflare.com/generate_204",
]

[history]
window = 16

[quality]
main_min_score = 70
white_min_score = 60
all_min_throughput_bps = 49152

[diversity]
endpoint = 3
subnet = 10
asn = 30

