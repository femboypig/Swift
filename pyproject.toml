[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "swift-proxy-filter"
version = "0.1.0"
description = "Swift collects public proxy configs, tests them, and keeps the ones that actually work."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Swift contributors" }]
dependencies = [
    "cryptography==50.0.1",
    "mtproxy-checker @ git+https://github.com/alimghmi/mtproxychecker.git@80224c93c47242575107c83eb603d675e49226e8",
]

[project.scripts]
swift-filter = "swiftproxy.main:cli"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
